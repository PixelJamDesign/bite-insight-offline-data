# Builds the offline product databases the app downloads, checks them and
# publishes them as the latest release.
#
# Monthly on the 2nd, after Open Food Facts has refreshed its export.
# A run by hand from the Actions tab is a dry run unless "dry_run" is
# unticked: it builds and checks, then keeps the files as a workflow
# artifact for a few days instead of making a release.
#
# Nothing is published unless scripts/offline-db/check.js passes, only a
# full build (every region) from main can be published, and only the
# publish job gets a token that can write to the repo.
name: Offline databases

on:
  schedule:
    - cron: '23 5 2 * *'   # 05:23 UTC on the 2nd (off the hour, when GitHub drops fewer runs)
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (build and check, no release)
        type: boolean
        default: true
      region:
        description: Build one region only, e.g. gb (dry runs only). Leave empty for all
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: offline-db
  cancel-in-progress: false

defaults:
  run:
    shell: bash   # bash -eo pipefail: any failing command stops the job

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      artifact: ${{ steps.plan.outputs.artifact }}
    env:
      OUT: ${{ github.workspace }}/offline-db-out
    steps:
      - name: Pick mode
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          REGION: ${{ inputs.region }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          publish=false
          if [ "$EVENT" = "schedule" ] || [ "$DRY_RUN" = "false" ]; then
            publish=true
          fi
          region=$(printf '%s' "$REGION" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          if [ -n "$region" ] && ! [[ "$region" =~ ^[a-z]{2}$ ]]; then
            echo "::error::region should be one code like gb, not \"$REGION\"."
            exit 1
          fi
          if [ "$publish" = "true" ] && [ -n "$region" ]; then
            echo "::error::A one-region build can't be published, the release has to hold every region. Run it again as a dry run, or leave region empty."
            exit 1
          fi
          if [ "$publish" = "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are only published from main, not $GITHUB_REF. Run it from main, or tick Dry run."
            exit 1
          fi

          # The date the run started is the release's version and tag, even
          # if the build finishes after midnight.
          version=$(date -u +%Y-%m-%d)
          tag="offline-db-v${version//-/.}"
          if [ "$publish" = "true" ] && gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Nothing was built. Delete it on the Releases page first if you want to replace it."
            exit 1
          fi

          if [ "$publish" = "true" ]; then
            artifact="offline-db-release-$GITHUB_RUN_NUMBER"
          else
            artifact="offline-db-dry-run-$GITHUB_RUN_NUMBER"
          fi
          {
            echo "publish=$publish"
            echo "region=$region"
            echo "version=$version"
            echo "tag=$tag"
            echo "artifact=$artifact"
          } >> "$GITHUB_OUTPUT"
          echo "Publish: $publish. Region: ${region:-all}. Version: $version."

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/offline-db/package-lock.json

      - name: Install
        working-directory: scripts/offline-db
        run: npm ci

      - name: Build
        working-directory: scripts/offline-db
        env:
          REGION: ${{ steps.plan.outputs.region }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          df -h "$GITHUB_WORKSPACE"
          args=(--out "$OUT" --version "$VERSION")
          if [ -n "$REGION" ]; then args+=(--region "$REGION"); fi
          node build-offline-db.js "${args[@]}"
          ls -l "$OUT"
          df -h "$GITHUB_WORKSPACE"

      - name: Check
        working-directory: scripts/offline-db
        env:
          REGION: ${{ steps.plan.outputs.region }}
        run: |
          args=(--dir "$OUT")
          if [ -n "$REGION" ]; then args+=(--regions "$REGION"); fi
          node check.js "${args[@]}"

      # Dry run: the files to look at. Publish: what the publish job uploads.
      - name: Keep the files
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.plan.outputs.artifact }}
          path: ${{ env.OUT }}
          retention-days: ${{ steps.plan.outputs.publish == 'true' && 1 || 5 }}
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # to create the release
    env:
      OUT: ${{ github.workspace }}/offline-db-out
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ env.OUT }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          version=$(node -p "require(process.env.OUT + '/manifest.json').version")
          if [ "$version" != "$VERSION" ]; then
            echo "::error::manifest.json says $version but the build was for $VERSION. Nothing was published."
            exit 1
          fi
          dotted=${version//-/.}
          tag="$TAG"

          # Checked again here: this token can also see drafts left behind
          # by a failed publish, which the build job's token can't.
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists (maybe as a draft). Nothing was published. Delete it on the Releases page first if you want to replace it."
            exit 1
          fi

          node scripts/offline-db/release-notes.js --dir "$OUT" > "$RUNNER_TEMP/notes.md"
          files=("$OUT"/*.db "$OUT/manifest.json")

          # Upload to a draft first. The app only sees published releases, so
          # if an upload fails nothing changes for users.
          gh release create "$tag" "${files[@]}" \
            --repo "$REPO" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Offline Database v$dotted" \
            --notes-file "$RUNNER_TEMP/notes.md"

          # Every file must be on the draft at its full size before it goes live.
          uploaded=$(gh release view "$tag" --repo "$REPO" --json assets --jq '.assets[] | "\(.name) \(.size)"' | sort)
          expected=$(for f in "${files[@]}"; do echo "$(basename "$f") $(stat -c %s "$f")"; done | sort)
          if [ "$uploaded" != "$expected" ]; then
            echo "::error::The draft release $tag doesn't hold every file at the right size, so it was left as a draft."
            diff <(echo "$expected") <(echo "$uploaded") || true
            exit 1
          fi

          gh release edit "$tag" --repo "$REPO" --draft=false --latest
          echo "Published https://github.com/$REPO/releases/tag/$tag" | tee -a "$GITHUB_STEP_SUMMARY"

  # GitHub turns off scheduled workflows in a public repo after 60 days
  # with no commits. Turning them back on each month resets that clock, for
  # this workflow and the nightly UK sync.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Keep the schedules on
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow enable offline-db.yml --repo "$REPO"
          gh workflow enable off-uk-sync.yml --repo "$REPO"
